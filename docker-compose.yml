services:
  postgres:
    image: postgres:16-alpine
    container_name: vacation_planner_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vacation_user
      POSTGRES_PASSWORD: vacation_password
      POSTGRES_DB: vacation_planner
    ports:
      - "5432:5432"
    volumes:
      - vacation_planner_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vacation_user -d vacation_planner"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  vacation_planner_postgres_data:
