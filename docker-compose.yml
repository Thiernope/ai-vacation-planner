services:
  postgres:
    image: postgres:16-alpine
    container_name: vacation_planner_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vacation_user
      POSTGRES_PASSWORD: vacation_password
      POSTGRES_DB: vacation_planner
    ports:
      # Host port 5433 avoids clashing with a Postgres that some macOS users
      # already run on the default 5432. Inside the container Postgres still
      # listens on 5432, so app config uses 5433 only for the host-side URL.
      - "5433:5432"
    volumes:
      - vacation_planner_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vacation_user -d vacation_planner"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  vacation_planner_postgres_data:
